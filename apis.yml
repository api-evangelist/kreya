aid: kreya
name: Kreya
description: >-
  Kreya is a GUI client for gRPC, REST, GraphQL, WebSocket, and Server-Sent
  Events APIs. All data is stored in git-diffable files for easy reviews and
  versioning. Kreya provides automated snapshot and scripted tests, flexible
  environments, and support for all gRPC streaming modes.
